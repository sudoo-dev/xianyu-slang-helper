<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>闲鱼黑话助手</title>
  <link rel="stylesheet" href="../popup.css" />
  <style>
    /* 覆盖 popup.css 的 380px 锁宽, 让背景铺满 */
    html, body {
      width: 100% !important;
      min-height: 100vh;
      background: linear-gradient(135deg, #fef3e7 0%, #fce4d4 100%) !important;
      padding: 0 !important;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 0 !important;
    }
    #popup-frame {
      width: 380px;
      box-shadow: 0 16px 48px rgba(200, 84, 31, 0.18);
      border-radius: 14px;
      overflow: hidden;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <div id="popup-frame">
    <div class="app">
      <header class="header">
        <div class="logo">🐟</div>
        <div class="title">
          <div class="title-main">闲鱼黑话助手</div>
          <div class="title-sub" id="title-sub">搜索翻译 / 黑话解读</div>
        </div>
      </header>

      <nav class="tabs">
        <button class="tab active" data-tab="translate">翻译</button>
        <button class="tab" data-tab="dict">词典</button>
        <button class="tab" data-tab="custom">我的</button>
        <button class="tab" data-tab="about">关于</button>
      </nav>

      <main class="content">
        <section class="panel active" id="panel-translate">
          <div class="input-wrap">
            <textarea id="translate-input" placeholder="输入正常词查黑话，或粘贴商品标题/描述解读黑话..." rows="3"></textarea>
            <button class="clear-btn" id="clear-btn" title="清空">×</button>
          </div>
          <div class="action-row">
            <button class="btn btn-primary" id="btn-to-slang">→ 转黑话</button>
            <button class="btn" id="btn-to-normal">← 解读黑话</button>
          </div>
          <div class="result" id="result-area">
            <div class="empty-state">输入文本后点击上方按钮</div>
          </div>
        </section>

        <section class="panel" id="panel-dict">
          <div class="search-wrap"><input id="dict-search" type="search" placeholder="搜索词典..." /></div>
          <div class="category-chips" id="category-chips"></div>
          <div class="dict-stats" id="dict-stats"></div>
          <div class="dict-list" id="dict-list"></div>
        </section>

        <section class="panel" id="panel-custom">
          <div class="custom-form">
            <input type="text" id="custom-normal" placeholder="正常词，如：路由器" />
            <input type="text" id="custom-slangs" placeholder="黑话变体（逗号或空格分隔）" />
            <div class="custom-form-actions">
              <button class="btn btn-primary" id="btn-custom-add">+ 添加</button>
              <button class="btn" id="btn-custom-cancel" style="display:none">取消</button>
            </div>
            <div class="custom-form-msg" id="custom-form-msg"></div>
          </div>
          <div class="custom-toolbar">
            <span class="custom-stats" id="custom-stats">0 条</span>
            <div class="custom-toolbar-actions">
              <button class="btn-mini" id="btn-custom-import">📥 导入</button>
              <button class="btn-mini" id="btn-custom-export">📤 导出</button>
              <button class="btn-mini btn-danger" id="btn-custom-clear">🗑️</button>
            </div>
          </div>
          <input type="file" id="custom-import-file" accept=".json" style="display:none" />
          <div class="custom-list" id="custom-list"></div>
        </section>

        <section class="panel" id="panel-about">
          <div class="version-card">
            <div class="version-row"><span class="version-label">词典版本</span><span class="version-value" id="meta-version">-</span></div>
            <div class="version-row"><span class="version-label">发布日期</span><span class="version-value" id="meta-updated">-</span></div>
            <div class="version-row"><span class="version-label">分类</span><span class="version-value" id="meta-categories">-</span></div>
            <div class="version-row"><span class="version-label">词条</span><span class="version-value" id="meta-entries">-</span></div>
          </div>
          <div class="setting-row">
            <div class="setting-info">
              <div class="setting-name">页面黑话高亮</div>
              <div class="setting-desc">在闲鱼页面给已知黑话加下划线提示</div>
            </div>
            <label class="switch"><input type="checkbox" id="setting-decode" /><span class="slider"></span></label>
          </div>
          <div class="about">
            <div class="about-title">💡 使用说明</div>
            <ul>
              <li>在闲鱼搜索框输入关键词，自动弹出黑话推荐</li>
              <li>点击推荐词替换搜索框内容</li>
              <li>商品标题/描述里的黑话会标黄，悬停看含义</li>
              <li>词典页可按分类筛选浏览</li>
              <li>插件不发起外部请求，全部本地运行</li>
            </ul>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="chrome-stub.js"></script>
  <script src="dict-plain.js"></script>
  <script src="dict-loader-demo.js"></script>
  <script src="../popup.js"></script>
</body>
</html>
